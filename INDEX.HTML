<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Grand Regel</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>GRAND REGEL RESTAURANT</h1>
      <nav>
        <a href="/">Home</a> |
       
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>FOOD IS WAITING FOR YOU</h2>
      <form action="search" method="get" class="search-form">
        <input type="text" name="q" placeholder="Search FOOD" required>
        <button type="submit">Search</button>
      </form>
    </section>

    <section class="packages">
      <h3>Popular FOOD</h3>
      <div class="grid">
        <article class="card"><h4>indian food</h4><p>300 rs. thali</p></article>
        <article class="card"><h4>punjabi thali</h4><p>350 rs. thali</p></article>
        <article class="card"><h4>Icecreams</h4><p>any flavour that you want</p></article>
      </div>
    </section>

    <section class="contact">
      <h3>Contact Us</h3>
      <p>Email: contact@grandregel.example</p>
      <p>Phone: +1 5547896</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; hotel grand regel</div>
  </footer>
</body>
</html>
